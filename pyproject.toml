[project]
name = "mis"
version = "0.1.0"
description = "Empirical comparison of exact exponential-time algorithms for enumerating maximal independent sets"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
